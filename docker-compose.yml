x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    container_name: keshepool-db
    restart: unless-stopped
    # Give Postgres time to checkpoint and flush WAL on shutdown — prevents corruption.
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume — survives `down`, `up`, and `--build`. Mapping unchanged on purpose
      # so existing data keeps its identity and is never re-initialised.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keshepool_data_net
    logging: *default-logging

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: keshepool-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Run every 6 hours for tight recovery point objective.
      SCHEDULE: "@every 6h"
      # Layered retention — short-term granularity plus long-term history.
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      # gzip level 6 — smaller dumps without heavy CPU cost.
      POSTGRES_EXTRA_OPTS: "-Z6"
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-28800}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind to host so dumps survive even total stack teardown and are reachable for off-site sync.
      - ./backups:/backups
      - ./scripts/check-backup.sh:/usr/local/bin/check-backup:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/check-backup"]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 6h30m
    networks:
      - keshepool_data_net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: keshepool-redis
    restart: unless-stopped
    # AOF persistence — webhook idempotency keys survive restarts, blocking double-credit.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keshepool_data_net
    logging: *default-logging

  static-init:
    image: ${BACKEND_IMAGE:-keshepool-backend:local}
    build:
      context: ./backend
    user: root
    command: ["sh", "-c", "mkdir -p /app/static && chown -R appuser:appuser /app/static"]
    restart: "no"
    volumes:
      - ./static:/app/static
    network_mode: "none"
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE:-keshepool-backend:local}
    build:
      context: ./backend
    entrypoint: ["/bin/sh", "-c"]
    command: ["python3 /app/scripts/stamp_if_legacy.py && alembic upgrade head"]
    restart: "no"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BOT_TOKEN=migration-not-used
      - ADMIN_BOT_TOKEN=migration-not-used
      - TELEGRAM_BOT_MODE=disabled
      - WEB_APP_URL=https://migration.invalid
      - ENVIRONMENT=migration
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keshepool_data_net
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-keshepool-backend:local}
    build:
      context: ./backend
    container_name: keshepool-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment: &backend-environment
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-10}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_RECYCLE_SECONDS=${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-5000}
      - DATABASE_IDLE_TRANSACTION_TIMEOUT_MS=${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      - REDIS_URL=redis://redis:6379/0
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_BOT_TOKEN=${ADMIN_BOT_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEB_APP_URL=${WEB_APP_URL}
      - MAIN_TELEGRAM_WEBHOOK_SECRET=${MAIN_TELEGRAM_WEBHOOK_SECRET:?Set a distinct main Telegram webhook secret}
      - ADMIN_TELEGRAM_WEBHOOK_SECRET=${ADMIN_TELEGRAM_WEBHOOK_SECRET:?Set a distinct admin Telegram webhook secret}
      - TETRA98_API_URL=${TETRA98_API_URL}
      - TETRA98_API_KEY=${TETRA98_API_KEY}
      - TETRA98_WEBHOOK_SECRET=${TETRA98_WEBHOOK_SECRET:-}
      - CRYPTO_WEBHOOK_SECRET=${CRYPTO_WEBHOOK_SECRET:-}
      - CRYPTO_DEPOSIT_ADDRESS_USDT=${CRYPTO_DEPOSIT_ADDRESS_USDT:-}
      - USDT_TO_IRR_RATE=${USDT_TO_IRR_RATE:?Set an operator-reviewed emergency USDT rate in .env}
      - OPERATIONS_RATE_DB_ENABLED=${OPERATIONS_RATE_DB_ENABLED:-false}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - ADMIN_GROUP_CHAT_ID=${ADMIN_GROUP_CHAT_ID:-}
      - ADMIN_REQUIRE_GROUP_ADMIN=${ADMIN_REQUIRE_GROUP_ADMIN:-false}
      - ADMIN_RBAC_ENABLED=${ADMIN_RBAC_ENABLED:-false}
      - ADMIN_ENV_BREAK_GLASS_ENABLED=${ADMIN_ENV_BREAK_GLASS_ENABLED:-true}
      - ADMIN_DUAL_APPROVAL_ENABLED=${ADMIN_DUAL_APPROVAL_ENABLED:-false}
      - ADMIN_DUAL_APPROVAL_WALLET_THRESHOLD_TOMAN=${ADMIN_DUAL_APPROVAL_WALLET_THRESHOLD_TOMAN:-10000000}
      - ADMIN_DUAL_APPROVAL_RATE_DEVIATION_PERCENT=${ADMIN_DUAL_APPROVAL_RATE_DEVIATION_PERCENT:-10}
      - ADMIN_FSM_TTL_SECONDS=${ADMIN_FSM_TTL_SECONDS:-3600}
      - TZ=${TZ:-Asia/Tehran}
      - ADMIN_REPORT_LANGUAGE=${ADMIN_REPORT_LANGUAGE:-fa}
      - BOT_USERNAME=${BOT_USERNAME:-keshepoolbot}
      - ASSET_ROOT=/app/static
      - PUBLIC_ASSET_BASE_URL=/static
      - SUPPORT_TELEGRAM_USERNAME=${SUPPORT_TELEGRAM_USERNAME:-}
      - ALLOW_INSECURE_DEV_AUTH=${ALLOW_INSECURE_DEV_AUTH:-false}
      - TELEGRAM_AUTH_MAX_AGE_SECONDS=${TELEGRAM_AUTH_MAX_AGE_SECONDS:-3600}
      - TELEGRAM_FINANCIAL_AUTH_MAX_AGE_SECONDS=${TELEGRAM_FINANCIAL_AUTH_MAX_AGE_SECONDS:-300}
      - AUTH_SESSION_EPOCH=${AUTH_SESSION_EPOCH:-1}
      - TELEGRAM_AUTH_FUTURE_SKEW_SECONDS=${TELEGRAM_AUTH_FUTURE_SKEW_SECONDS:-60}
      - TELEGRAM_INIT_DATA_MAX_BYTES=${TELEGRAM_INIT_DATA_MAX_BYTES:-8192}
      - TELEGRAM_WEBHOOK_MAX_BYTES=${TELEGRAM_WEBHOOK_MAX_BYTES:-1048576}
      - TELEGRAM_WEBHOOK_MAX_JSON_DEPTH=${TELEGRAM_WEBHOOK_MAX_JSON_DEPTH:-32}
      - TELEGRAM_INBOX_BATCH_SIZE=${TELEGRAM_INBOX_BATCH_SIZE:-20}
      - TELEGRAM_INBOX_POLL_SECONDS=${TELEGRAM_INBOX_POLL_SECONDS:-0.5}
      - TELEGRAM_INBOX_STALE_SECONDS=${TELEGRAM_INBOX_STALE_SECONDS:-300}
      - TELEGRAM_INBOX_MAX_ATTEMPTS=${TELEGRAM_INBOX_MAX_ATTEMPTS:-8}
      - TELEGRAM_INBOX_RETRY_SECONDS=${TELEGRAM_INBOX_RETRY_SECONDS:-10}
      - USER_LAST_SEEN_WRITE_INTERVAL_SECONDS=${USER_LAST_SEEN_WRITE_INTERVAL_SECONDS:-300}
      - CACHE_NAMESPACE=${CACHE_NAMESPACE:-keshepool}
      - CATALOG_CACHE_TTL_SECONDS=${CATALOG_CACHE_TTL_SECONDS:-30}
      - CATALOG_CACHE_LOCK_TTL_SECONDS=${CATALOG_CACHE_LOCK_TTL_SECONDS:-5}
      - REDIS_CONNECT_TIMEOUT_SECONDS=${REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      - REDIS_SOCKET_TIMEOUT_SECONDS=${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-50}
      - REDIS_RETRY_ATTEMPTS=${REDIS_RETRY_ATTEMPTS:-3}
      - REDIS_RETRY_BACKOFF_MAX_SECONDS=${REDIS_RETRY_BACKOFF_MAX_SECONDS:-1}
      - INGRESS_SENSITIVE_MAX_IN_FLIGHT=${INGRESS_SENSITIVE_MAX_IN_FLIGHT:-64}
      - INGRESS_IN_FLIGHT_TTL_SECONDS=${INGRESS_IN_FLIGHT_TTL_SECONDS:-120}
      - TETRA98_CALLBACK_ALLOWED_CIDRS=${TETRA98_CALLBACK_ALLOWED_CIDRS:-}
      - CRYPTO_CALLBACK_ALLOWED_CIDRS=${CRYPTO_CALLBACK_ALLOWED_CIDRS:-}
      - CREDENTIAL_VAULT_DUAL_WRITE_ENABLED=${CREDENTIAL_VAULT_DUAL_WRITE_ENABLED:-false}
      - CREDENTIAL_VAULT_READ_PREFER_ENCRYPTED=${CREDENTIAL_VAULT_READ_PREFER_ENCRYPTED:-false}
      - CREDENTIAL_VAULT_LEGACY_FALLBACK_ENABLED=${CREDENTIAL_VAULT_LEGACY_FALLBACK_ENABLED:-true}
      - CREDENTIAL_VAULT_FINALIZE_ENABLED=${CREDENTIAL_VAULT_FINALIZE_ENABLED:-false}
      - CREDENTIAL_VAULT_ENCRYPTION_KEYS_FILE=${CREDENTIAL_VAULT_ENCRYPTION_KEYS_FILE:-}
      - CREDENTIAL_VAULT_FINGERPRINT_KEY_FILE=${CREDENTIAL_VAULT_FINGERPRINT_KEY_FILE:-}
      - CREDENTIAL_REVEAL_MAX_PER_ORDER=${CREDENTIAL_REVEAL_MAX_PER_ORDER:-5}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ENABLE_INTERNAL_ADMIN_API=${ENABLE_INTERNAL_ADMIN_API:-false}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:?Set exact Caddy and frontend proxy addresses or reviewed proxy network ranges}
      - CSP_REPORT_ONLY=${CSP_REPORT_ONLY:-true}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./static:/app/static
    depends_on:
      static-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - keshepool_data_net
      - caddy_gateway_net
    logging: *default-logging

  telegram-worker:
    image: ${BACKEND_IMAGE:-keshepool-backend:local}
    build:
      context: ./backend
    container_name: keshepool-telegram-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["python", "-m", "app.workers.telegram_inbox"]
    environment: *backend-environment
    volumes:
      - ./static:/app/static
    depends_on:
      static-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - keshepool_data_net
      - keshepool_worker_egress_net
    logging: *default-logging

  telegram-configure:
    image: ${BACKEND_IMAGE:-keshepool-backend:local}
    build:
      context: ./backend
    profiles: ["ops"]
    restart: "no"
    command: ["python", "/app/scripts/configure_telegram.py"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://unused:unused@127.0.0.1:1/unused
      - REDIS_URL=redis://127.0.0.1:1/0
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_BOT_TOKEN=${ADMIN_BOT_TOKEN}
      - TELEGRAM_BOT_MODE=webhook
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEB_APP_URL=${WEB_APP_URL}
      - MAIN_TELEGRAM_WEBHOOK_SECRET=${MAIN_TELEGRAM_WEBHOOK_SECRET:?Set a distinct main Telegram webhook secret}
      - ADMIN_TELEGRAM_WEBHOOK_SECRET=${ADMIN_TELEGRAM_WEBHOOK_SECRET:?Set a distinct admin Telegram webhook secret}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - ADMIN_GROUP_CHAT_ID=${ADMIN_GROUP_CHAT_ID:-}
      - ADMIN_REQUIRE_GROUP_ADMIN=${ADMIN_REQUIRE_GROUP_ADMIN:-false}
      - USDT_TO_IRR_RATE=${USDT_TO_IRR_RATE:?Set an operator-reviewed emergency USDT rate in .env}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:?Set exact Caddy and frontend proxy addresses or reviewed proxy network ranges}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    networks:
      - keshepool_worker_egress_net
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-keshepool-frontend:local}
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: /api
        DEPLOYMENT_VERSION: ${IMAGE_TAG:-local}
    container_name: keshepool-frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - PUBLIC_BASE_URL=${WEB_APP_URL}
      - DEPLOYMENT_VERSION=${IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          (async () => {
            try {
              const response = await fetch('http://127.0.0.1:3000/health/live', { signal: AbortSignal.timeout(3000) });
              const body = (await response.text()).slice(0, 500);
              if (!response.ok) {
                console.error('frontend health HTTP ' + response.status + ': ' + body);
                process.exit(1);
              }
              let payload;
              try { payload = JSON.parse(body); } catch (error) {
                console.error('frontend health malformed response: ' + error.name + ': ' + error.message);
                process.exit(1);
              }
              if (payload.status !== 'alive') {
                console.error('frontend health invalid body: ' + body);
                process.exit(1);
              }
              console.log('frontend health ok: HTTP ' + response.status);
            } catch (error) {
              console.error('frontend health ' + (error.name || 'Error') + ': ' + (error.message || String(error)));
              process.exit(1);
            }
          })();
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - caddy_gateway_net
    logging: *default-logging

volumes:
  pgdata:
  redisdata:

networks:
  keshepool_data_net:
    name: keshepool_data_net
    internal: true
  keshepool_worker_egress_net:
    name: keshepool_worker_egress_net
    driver: bridge
  caddy_gateway_net:
    external: true
