title = "Keshepool secret scan"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{6,12}:[A-Za-z0-9_-]{30,}\b'''

[[rules]]
id = "configured-high-entropy-secret"
description = "High entropy value assigned to a secret setting"
regex = '''(?i)(?:api[_-]?key|secret|token|password|private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9+/_=-]{32,}'''

[[allowlists]]
description = "Clearly fake test and example values"
regexTarget = "line"
regexes = [
  '''(?i)(your_main_bot_token|your_stealth_admin_token|change_me_to_a_strong_random_password|your_long_random_secure_string_here|a_very_long_random_string|replace_with_current_toman_rate|test[-_]webhook[-_]secret|test[-_]admin([-_]api)?[-_]key|keshepool_test_password)''',
  '''123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA''',
  '''123457:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB'''
]
